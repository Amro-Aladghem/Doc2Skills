version: "3.8"

services:
  doc2skills:
    build: .
    ports:
      - "80:80"
    environment:
      - PYTHONUNBUFFERED=1
      - CHROME_BIN=/usr/bin/google-chrome-stable
    volumes:
      - ./CustomSkills:/app/CustomSkills
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

